<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusFind AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .choose-wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(900px 500px at 15% -10%, #1f5f4f22, transparent),
                radial-gradient(700px 500px at 110% 10%, #c8862b1c, transparent), var(--paper); padding: 24px; }
  .choose-brand { text-align:center; margin-bottom: 36px; }
  .choose-brand .glyph { font-family: var(--serif); font-weight:700; font-size:26px; background: var(--brand-deep); color:#fff; width:48px;height:48px;border-radius:11px; display:inline-flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .choose-brand h1 { font-family: var(--serif); font-size: 26px; margin: 6px 0 4px; }
  .choose-brand .tag { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color: var(--ink-soft); }
  .choose-cards { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; max-width:640px; }
  .choose-card { width: 260px; background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow: var(--shadow); padding: 28px 24px; text-decoration:none; color:var(--ink); transition: transform .12s ease, box-shadow .12s ease; }
  .choose-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(16,24,32,0.12); }
  .choose-card .cc-icon { width:44px;height:44px;border-radius:10px; display:flex;align-items:center;justify-content:center; font-size:20px; margin-bottom:16px; }
  .choose-card.student .cc-icon { background: var(--brand-soft); color: var(--brand-deep); }
  .choose-card.admin .cc-icon { background: #2a2118; color: var(--amber); }
  .choose-card h3 { font-family: var(--serif); font-size:18px; margin:0 0 6px; }
  .choose-card p { font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin:0; }
  .choose-card .cc-cta { display:inline-block; margin-top:16px; font-size:12.5px; font-weight:700; }
  .choose-card.student .cc-cta { color: var(--brand-deep); }
  .choose-card.admin .cc-cta { color: #2a2118; }
</style>
</head>
<body>
<div class="choose-wrap">
  <div class="choose-brand">
    <span class="glyph">C</span>
    <h1>CampusFind AI</h1>
    <div class="tag">Find &middot; Match &middot; Verify &middot; Return</div>
  </div>

  <div class="choose-cards">
    <a class="choose-card student" href="student-login.html">
      <div class="cc-icon">&#127891;</div>
      <h3>Student / Staff</h3>
      <p>Report a lost item, register something you found, track matches and claims.</p>
      <span class="cc-cta">Continue &rarr;</span>
    </a>
    <a class="choose-card admin" href="admin-login.html">
      <div class="cc-icon">&#9878;</div>
      <h3>Administrator</h3>
      <p>Review claims, verify ownership, manage records and view campus-wide analytics.</p>
      <span class="cc-cta">Continue &rarr;</span>
    </a>
  </div>
</div>
<script src="js/app.js"></script>
<script>
  // If already signed in, skip straight to the dashboard instead of re-prompting.
  if (Auth.user) window.location.href = "dashboard.html";
</script>
</body>
</html>
