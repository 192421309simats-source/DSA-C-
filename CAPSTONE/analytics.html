<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — CampusFind AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/app.js"></script>
<script>
const content = renderShell("analytics.html", "Campus Recovery Analytics", "Computed live from stored records — nothing here is hard-coded.");
content.innerHTML = `<div class="muted">Crunching numbers…</div>`;

function barChart(title, data, color) {
  const max = Math.max(1, ...data.map(d => d.count));
  return `
    <div class="panel" style="margin-bottom:16px">
      <div class="panel-head"><h3>${title}</h3></div>
      <div class="panel-pad">
        ${data.length ? data.map(d => `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px">
            <div style="width:120px" class="muted">${escapeHtml(d.label || "Unspecified")}</div>
            <div style="flex:1;background:#eee5cf;border-radius:5px;height:10px;overflow:hidden">
              <div style="width:${(d.count/max)*100}%;height:100%;background:${color}"></div>
            </div>
            <div class="mono" style="width:26px;text-align:right">${d.count}</div>
          </div>`).join("") : `<div class="muted" style="font-size:13px">No data yet.</div>`}
      </div>
    </div>`;
}

async function load() {
  const [dash, an] = await Promise.all([api("/dashboard"), api("/analytics")]);
  content.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${dash.recoveryRate}%</div><div class="stat-label">Recovery Rate</div></div>
      <div class="stat-card"><div class="stat-num">${an.matchSuccessRate}%</div><div class="stat-label">Match Success Rate</div></div>
      <div class="stat-card"><div class="stat-num">${an.claimApprovalRate}%</div><div class="stat-label">Claim Approval Rate</div></div>
      <div class="stat-card"><div class="stat-num">${dash.averageMatchScore}</div><div class="stat-label">Avg Match Score</div></div>
    </div>
    <div class="grid-2">
      <div>
        ${barChart("Lost Items by Category", an.lostByCategory, "var(--red)")}
        ${barChart("Found Items by Category", an.foundByCategory, "var(--brand)")}
      </div>
      <div>
        ${barChart("Reports by Campus Location", an.byLocation, "var(--blue)")}
        ${barChart("Monthly Lost Reports", an.lostByMonth, "var(--amber)")}
      </div>
    </div>
  `;
}
load().catch(e => toast(e.message, "error"));
</script>
</body>
</html>
