<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student / Staff Sign In — CampusFind AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:14px">
      <a href="index.html" style="font-size:12px;color:var(--ink-soft);text-decoration:none">&larr; Back</a>
    </div>
    <div class="login-brand"><span class="glyph">C</span><span class="name">CampusFind AI</span></div>
    <div class="login-tag" style="color:var(--brand-deep)">Student &amp; Staff Portal</div>

    <div class="login-toggle">
      <button id="tabLogin" class="active">Sign in</button>
      <button id="tabRegister">Create account</button>
    </div>

    <div id="errorBox"></div>

    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="you@campusfind.edu" required></div>
      <div class="field"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••" required></div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <form id="registerForm" style="display:none">
      <div class="field"><label>Full name</label><input type="text" id="regName" required></div>
      <div class="field"><label>Email</label><input type="email" id="regEmail" required></div>
      <div class="field"><label>Password</label><input type="password" id="regPassword" required></div>
      <div class="field"><label>Role</label>
        <select id="regRole">
          <option value="STUDENT">Student</option>
          <option value="STAFF">Staff</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <div class="demo-note">
      Demo student: <code>aditi@campusfind.edu</code> / <code>student123</code><br>
      Are you an administrator? <a href="admin-login.html">Sign in here instead</a>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  if (Auth.user) window.location.href = "dashboard.html";

  const tabLogin = document.getElementById("tabLogin");
  const tabRegister = document.getElementById("tabRegister");
  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");
  const errorBox = document.getElementById("errorBox");

  tabLogin.onclick = () => { tabLogin.classList.add("active"); tabRegister.classList.remove("active"); loginForm.style.display="block"; registerForm.style.display="none"; errorBox.innerHTML=""; };
  tabRegister.onclick = () => { tabRegister.classList.add("active"); tabLogin.classList.remove("active"); registerForm.style.display="block"; loginForm.style.display="none"; errorBox.innerHTML=""; };

  function showError(msg) { errorBox.innerHTML = `<div class="error-banner">${escapeHtml(msg)}</div>`; }

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.innerHTML = "";
    try {
      const data = await api("/login", { method: "POST", body: JSON.stringify({
        email: document.getElementById("loginEmail").value.trim(),
        password: document.getElementById("loginPassword").value,
        expectedRole: "STUDENT" // server rejects admin accounts on this portal
      })});
      Auth.user = data;
      window.location.href = "dashboard.html";
    } catch (err) { showError(err.message); }
  });

  registerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.innerHTML = "";
    try {
      await api("/register", { method: "POST", body: JSON.stringify({
        name: document.getElementById("regName").value.trim(),
        email: document.getElementById("regEmail").value.trim(),
        password: document.getElementById("regPassword").value,
        role: document.getElementById("regRole").value
      })});
      toast("Account created — please sign in.", "success");
      tabLogin.click();
    } catch (err) { showError(err.message); }
  });
</script>
</body>
</html>
