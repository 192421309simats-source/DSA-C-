<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Found Item — CampusFind AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/app.js"></script>
<script>
const content = renderShell("register-found.html", "Register a Found Item", "CampusMatch runs automatically the moment you save this record.");

content.innerHTML = `
  <div class="grid-2">
    <div class="panel panel-pad">
      <form id="foundForm">
        <div class="form-grid">
          <div class="field"><label>Item Name *</label><input type="text" id="itemName" required placeholder="e.g. Backpack"></div>
          <div class="field"><label>Category *</label>
            <select id="category" required>
              <option value="">Select…</option>
              <option>Electronics</option><option>Bags</option><option>ID / Documents</option>
              <option>Wallet</option><option>Jewelry</option><option>Books</option>
              <option>Clothing</option><option>Keys</option><option>Other</option>
            </select>
          </div>
          <div class="field"><label>Color</label><input type="text" id="color"></div>
          <div class="field"><label>Brand</label><input type="text" id="brand"></div>
          <div class="field"><label>Location Found *</label><input type="text" id="location" required></div>
          <div class="field"><label>Date Found</label><input type="date" id="date"></div>
          <div class="field"><label>Approximate Time</label><input type="time" id="time"></div>
          <div class="field"><label>Current Storage Location</label><input type="text" id="storageLocation" placeholder="e.g. Lost & Found Office"></div>
        </div>
        <div class="field"><label>Description</label><textarea id="description"></textarea></div>
        <div class="field"><label>Unique Identifying Feature</label><input type="text" id="uniqueFeature" placeholder="Anything distinctive you noticed"></div>
        <div class="field">
          <label>Photo (optional)</label>
          <input type="file" id="itemPhoto" accept="image/*">
          <div class="hint">Used for real photo-similarity comparison against lost-item reports.</div>
          <img id="photoPreview" style="display:none;max-width:160px;border-radius:8px;margin-top:8px;border:1px solid var(--line)">
        </div>
        <button type="submit" class="btn btn-primary">Register Found Item</button>
      </form>
    </div>
    <div id="resultArea"></div>
  </div>
`;

function formatDate(iso) { if (!iso) return ""; const [y,m,d] = iso.split("-"); return `${d}-${m}-${y}`; }

document.getElementById("itemPhoto").addEventListener("change", async () => {
  const dataUrl = await readImageAsDataUrl(document.getElementById("itemPhoto"));
  const preview = document.getElementById("photoPreview");
  if (dataUrl) { preview.src = dataUrl; preview.style.display = "block"; }
  else { preview.style.display = "none"; }
});

document.getElementById("foundForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = {
    itemName: document.getElementById("itemName").value.trim(),
    category: document.getElementById("category").value,
    color: document.getElementById("color").value.trim(),
    brand: document.getElementById("brand").value.trim(),
    location: document.getElementById("location").value.trim(),
    date: formatDate(document.getElementById("date").value),
    time: document.getElementById("time").value,
    description: document.getElementById("description").value.trim(),
    uniqueFeature: document.getElementById("uniqueFeature").value.trim(),
    storageLocation: document.getElementById("storageLocation").value.trim(),
    imageBase64: await readImageAsDataUrl(document.getElementById("itemPhoto"))
  };
  const resultArea = document.getElementById("resultArea");
  try {
    const res = await api("/found", { method: "POST", body: JSON.stringify(body) });
    toast("Found item " + res.item.itemId + " registered.", "success");
    const sorted = (res.matches || []).slice().sort((a,b) => b.score - a.score);
    let html = `<div class="panel panel-pad"><div class="success-banner">Registered as <strong>${res.item.itemId}</strong>.</div>`;
    if (sorted.length) {
      html += `<div class="section-title" style="margin-top:6px">${sorted.length} Possible Match${sorted.length>1?"es":""} Found</div>`;
      html += `<div class="mono muted" style="font-size:12px;margin-bottom:10px">Highest Match: ${sorted[0].score}% — ${sorted[0].confidence}</div>`;
      html += sorted.slice(0,4).map(m => `
        <div class="match-card">
          ${scoreRingSVG(m.score, 56)}
          <div class="mc-body">
            <div class="mc-title">${m.sourceId}</div>
            <div class="mc-meta"><span class="badge ${confidenceBadgeClass(m.confidence)}">${m.confidence}</span></div>
          </div>
          <a class="btn btn-sm btn-primary" href="match-details.html?lostId=${m.sourceId}&foundId=${res.item.itemId}">View</a>
        </div>`).join("");
    } else {
      html += `<div class="empty-state"><div class="es-icon">&#10022;</div><h4>No matches yet</h4><div>It'll surface automatically once a matching lost report appears.</div></div>`;
    }
    html += `</div>`;
    resultArea.innerHTML = html;
    document.getElementById("foundForm").reset();
  } catch (err) {
    resultArea.innerHTML = `<div class="panel panel-pad"><div class="error-banner">${escapeHtml(err.message)}</div></div>`;
  }
});
</script>
</body>
</html>
