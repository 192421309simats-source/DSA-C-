<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Matching — CampusFind AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/app.js"></script>
<script>
const content = renderShell("smart-matching.html", "CampusMatch Engine", "Weighted multi-attribute comparison across every active report — ranked and explained.");
content.innerHTML = `<div id="list"><div class="muted">Running CampusMatch…</div></div>`;

async function load() {
  const uid = Auth.user.userId;
  const isAdmin = Auth.isAdmin();
  const lost = await api("/lost" + (isAdmin ? "" : "?userId=" + encodeURIComponent(uid)));
  const active = lost.filter(i => i.status === "ACTIVE");
  if (!active.length) {
    document.getElementById("list").innerHTML = `<div class="panel panel-pad"><div class="empty-state"><div class="es-icon">&#10022;</div><h4>No active lost reports</h4><div>Report a lost item to see CampusMatch results here.</div></div></div>`;
    return;
  }
  let html = "";
  for (const item of active) {
    const matches = await api("/matches/" + item.itemId);
    html += `
      <div class="panel" style="margin-bottom:16px">
        <div class="panel-head">
          <h3>${escapeHtml(item.itemName)} <span class="mono muted" style="font-size:11.5px;font-weight:400">· ${item.itemId}</span></h3>
          <span class="badge ${statusBadgeClass(item.status)}">${item.status}</span>
        </div>
        <div class="panel-pad">
          ${matches.length ? matches.slice(0,4).map((m,idx) => `
            <div class="match-card">
              <div class="mono muted" style="width:16px">${idx+1}.</div>
              ${scoreRingSVG(m.score, 56)}
              <div class="mc-body">
                <div class="mc-title">${m.targetId}</div>
                <div class="mc-meta"><span class="badge ${confidenceBadgeClass(m.confidence)}">${m.confidence}</span></div>
              </div>
              <a class="btn btn-sm btn-primary" href="match-details.html?lostId=${item.itemId}&foundId=${m.targetId}">View Match</a>
            </div>
          `).join("") : `<div class="muted" style="font-size:13px">No candidate found items yet for this report.</div>`}
        </div>
      </div>`;
  }
  document.getElementById("list").innerHTML = html;
}
load().catch(e => toast(e.message, "error"));
</script>
</body>
</html>
